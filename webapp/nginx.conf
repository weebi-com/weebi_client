server {
    listen __PORT__;
    server_name _;

    gzip on;
    gzip_types application/json text/css text/javascript application/javascript application/wasm image/svg+xml;

    # Flutter WASM (skwasm) uses SharedArrayBuffer / workers. Browsers only
    # enable that when COOP+COEP are present on the document AND on .js/.wasm
    # worker scripts. nginx does not inherit add_header into a location that
    # sets its own add_header — repeat both headers on every location.
    types {
        application/wasm wasm;
    }

    # config.json is written by entrypoint.sh from Cloud Run env (API_URL, LOCALE).
    # No caching so the app always gets current values; correct type for fetch().
    location = /config.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Entry points - no cache to ensure users always get the latest version
    location ~* (?:index\.html|flutter_bootstrap\.js)$ {
        root /usr/share/nginx/html;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Flutter/WASM payloads are not content-hashed. `immutable` here causes
    # mobile Chrome to keep a stale .wasm/.js after deploy → white screen.
    location ~* \.(?:js|wasm)$ {
        root /usr/share/nginx/html;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # Hashed/static media — safe to cache long-term
    location ~* \.(?:css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Browsers often request /favicon.ico before HTML; without this, try_files serves index.html (wrong MIME).
    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.png;
        default_type image/png;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }
}
