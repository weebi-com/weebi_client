server {
    listen __PORT__;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/css text/javascript application/javascript image/svg+xml;

    # config.json is written by entrypoint.sh from Cloud Run env (API_URL, LOCALE).
    # No caching so the app always gets current values.
    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Entry points - no cache to ensure users always get the latest version
    location ~* (?:index\.html|flutter_bootstrap\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Flutter payloads are not content-hashed. `no-cache` ensures we revalidate.
    location ~* \.js$ {
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # Hashed/static media — safe to cache long-term
    location ~* \.(?:css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Browsers often request /favicon.ico before HTML
    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
