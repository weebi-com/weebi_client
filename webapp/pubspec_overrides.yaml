# melos_managed_dependency_overrides: accesses_weebi,design_weebi,devices_weebi,users_weebi,flutter_secure_storage_web,flutter_secure_storage_platform_interface
# Local-only (gitignored). Enables TDD against unpublished bridge RPCs.
# Do not ship / push weebi_client with path overrides for protos_weebi.
dependency_overrides:
  accesses_weebi:
    path: ..\\packages\\accesses
  auth_weebi:
    path: ../packages/auth
  boutiques_weebi:
    path: ../packages/boutiques
  design_weebi:
    path: ..\\packages\\design
  devices_weebi:
    path: ..\\packages\\devices
  entitlements_weebi:
    path: ../packages/entitlements
  flutter_secure_storage_platform_interface: ^2.0.3
  flutter_secure_storage_web: ^2.1.1
  users_weebi:
    path: ..\\packages\\users
