dependency_overrides:
  auth_weebi:
    path: ../../weebi/packages/auth
  entitlements_weebi:
    path: ../../weebi/packages/entitlements
  boutiques_weebi:
    path: ../../weebi/packages/boutiques
  users_weebi:
    path: ../../weebi/packages/users
  accesses_weebi:
    path: ../../weebi/packages/accesses
  devices_weebi:
    path: ../../weebi/packages/devices
  design_weebi:
    path: ../packages/design
  protos_weebi:
    path: ../../weebi_server/packages/protos/protos_weebi
  flutter_secure_storage_web: ^2.1.1
  flutter_secure_storage_platform_interface: ^2.0.3
