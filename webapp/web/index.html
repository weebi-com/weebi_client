<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Weebi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: ?v bumps cache when asset changes. Icons in web/icons/ must match (manifest + some browsers). -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2"/>

  <title>Weebi</title>
  <link rel="manifest" href="manifest.json">

  <!-- Leaflet + markercluster for the boutiques map screen -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    window.customClusterIcon = function(cluster) {
      if (typeof window.dartPieClusterIcon !== 'function') {
        return new L.DivIcon({
          html: '<div>' + cluster.getChildCount() + '</div>',
          className: 'pie-cluster-icon',
          iconSize: [48, 48]
        });
      }
      return new L.DivIcon({
        html: window.dartPieClusterIcon(cluster),
        className: '',
        iconSize: [48, 48]
      });
    };
  </script>
  <style>
    .pie-cluster-icon {
      width: clamp(32px, 7vw, 56px);
      height: clamp(32px, 7vw, 56px);
      border-radius: 50%;
      box-shadow: 0 4px 16px rgba(50, 80, 160, 0.18), 0 0 0 3px #fff;
      border: 2px solid #fff;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #weebi-boutiques-map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
